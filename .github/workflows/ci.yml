name: Build GBA ROM

on:
  push:
    branches: [main]
    # A pushed ZIP is handled by unpack.yml, which starts this workflow itself.
    paths-ignore:
      - '*.zip'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      butano_ref:
        description: 'Butano tag or branch to build against'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: gba-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Default Butano version. Override per-run with the workflow_dispatch input,
  # or repo-wide with a repository variable named BUTANO_REF.
  BUTANO_REF: ${{ inputs.butano_ref || vars.BUTANO_REF || '21.9.0' }}
  ROM_FILE: jojo_allstar_gba.gba
  ROM_TITLE: JOJO ALLSTAR
  ROM_CODE: JJBA

jobs:
  build:
    name: Validate and build ROM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure required tools
        shell: bash
        run: |
          set -euo pipefail
          need_install=0
          for t in python3 git make unzip; do
            command -v "$t" >/dev/null || need_install=1
          done
          if [ "$need_install" -eq 1 ]; then
            apt-get update -qq
            apt-get install -y -qq python3 git make unzip
          fi
          command -v arm-none-eabi-g++ >/dev/null || { echo "::error::devkitARM not found in image"; exit 1; }
          arm-none-eabi-g++ --version | head -n 1
          python3 --version
          make --version | head -n 1

      - name: Make sure asset folders exist
        run: mkdir -p include graphics audio dmg_audio build

      - name: Validate roster
        run: python3 scripts/validate_roster.py

      - name: Cache Butano
        id: butano-cache
        uses: actions/cache@v4
        with:
          path: ../butano
          key: butano-${{ env.BUTANO_REF }}

      - name: Fetch Butano
        if: steps.butano-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ../butano
          git clone --depth 1 --branch "$BUTANO_REF" https://github.com/GValiente/butano.git ../butano

      - name: Check Butano
        run: test -f ../butano/butano.mak

      - name: Build ROM
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Verify ROM
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ROM_FILE"
          python3 scripts/verify_gba_rom.py "$ROM_FILE" --title "$ROM_TITLE" --code "$ROM_CODE" | tee rom-verification.log

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## GBA build"
            echo "- Butano ref: \`$BUTANO_REF\`"
            if [ -f "$ROM_FILE" ]; then
              echo "- ROM: \`$ROM_FILE\` ($(du -h "$ROM_FILE" | cut -f1))"
              echo "- SHA-256: \`$(sha256sum "$ROM_FILE" | cut -d' ' -f1)\`"
            else
              echo "- ROM was **not** produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: jojo-allstar-gba-${{ github.run_number }}
          path: ${{ env.ROM_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            build.log
            rom-verification.log
          if-no-files-found: ignore
          retention-days: 14
