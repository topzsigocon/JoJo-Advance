name: JoJo-Advance CI - Toolchain and ROM Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jojo-advance-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify devkitARM, Butano and build ROM
    runs-on: ubuntu-latest
    # Use the official devkitPro GBA development image.
    # Pin a dated tag so the toolchain does not silently change.
    container:
      image: devkitpro/devkitarm:20260610

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create diagnostic directory
        shell: bash
        run: mkdir -p diagnostics

      - name: Diagnose devkitPro image and compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "===== CONTAINER ====="
            cat /etc/os-release || true
            echo
            echo "===== DEVKITPRO ENVIRONMENT ====="
            echo "DEVKITPRO=$DEVKITPRO"
            echo "DEVKITARM=$DEVKITARM"
            echo "PATH=$PATH"
            echo
            echo "===== /opt/devkitpro ====="
            ls -la /opt/devkitpro
            echo
            echo "===== devkitARM directory ====="
            if [[ -d "$DEVKITARM" ]]; then
              ls -la "$DEVKITARM"
            else
              echo "Expected directory missing: $DEVKITARM"
              find /opt/devkitpro -maxdepth 4 -type d -iname '*devkitarm*' -print || true
              find / -type f -name arm-none-eabi-g++ 2>/dev/null | head -n 20 || true
              exit 1
            fi
            echo
            echo "===== REQUIRED COMMANDS ====="
            for tool in arm-none-eabi-g++ arm-none-eabi-gcc arm-none-eabi-ld make python3 git; do
              command -v "$tool"
            done
            echo
            arm-none-eabi-g++ --version
            make --version | head -n 1
            python3 --version
          } 2>&1 | tee diagnostics/toolchain.log

      - name: Validate project files
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "===== ROOT FILES ====="
            ls -la
            echo
            for file in Makefile src/main.cpp scripts/validate_roster.py scripts/verify_gba_rom.py; do
              if [[ -f "$file" ]]; then
                echo "PASS: $file"
              else
                echo "FAIL: missing $file"
                exit 1
              fi
            done
            echo
            python3 scripts/validate_roster.py
          } 2>&1 | tee diagnostics/project.log

      - name: Fetch Butano 21.9.0
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf ../butano
          git clone --depth 1 --branch 21.9.0 https://github.com/GValiente/butano.git ../butano
          test -f ../butano/butano.mak
          git -C ../butano describe --tags --always
        # Butano source is fetched outside the project directory because
        # the project's Makefile expects LIBBUTANO := ../butano.

      - name: Build GBA ROM
        shell: bash
        run: |
          set -Eeuo pipefail
          make clean
          make -j2 2>&1 | tee diagnostics/build.log
          test -s jojo_allstar_gba.gba

      - name: Verify GBA ROM
        shell: bash
        run: |
          set -Eeuo pipefail
          ls -lh jojo_allstar_gba.gba
          python3 scripts/verify_gba_rom.py jojo_allstar_gba.gba 2>&1 | tee diagnostics/rom.log

      - name: Upload CI report and ROM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jojo-advance-ci-${{ github.run_number }}
          path: |
            diagnostics/
            jojo_allstar_gba.gba
          if-no-files-found: warn
          retention-days: 30
