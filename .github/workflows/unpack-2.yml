name: Unpack update.zip

# This workflow only extracts uploaded ZIP files and commits the changes.
# Your separate CI/build workflow should start after this commit is pushed.
on:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Unpack ZIP files from repository root
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          zips=(*.zip)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::notice::Walang .zip sa repository root; walang gagawin."
            exit 0
          fi

          for z in "${zips[@]}"; do
            echo "Extracting: $z"
            unzip -t "$z"
            unzip -o "$z" -x ".github/*"
            git rm -q -f -- "$z"
          done

      - name: Apply REMOVE.txt instructions
        shell: bash
        run: |
          set -euo pipefail
          if [ -f REMOVE.txt ]; then
            while IFS= read -r path || [ -n "$path" ]; do
              case "$path" in
                ''|'#'*|.git*|*..*|/*) continue ;;
              esac
              git rm -r -q --ignore-unmatch -- "$path"
            done < REMOVE.txt
            rm -f REMOVE.txt
          fi

      - name: Commit extracted project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Walang pagbabago; walang commit na gagawin."
            exit 0
          fi
          git commit -m "Unpack update ZIP"
          git push
