name: Unpack update.zip

# Accepts update.zip at repository root.
# Automatically removes a single enclosing project folder in the ZIP.
# Keeps the active unpack.yml and ci.yml workflows intact.
on:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract ZIP and merge project files into repository root
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          zips=( *.zip )
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::No ZIP archive found in repository root."
            exit 1
          fi

          for zipfile in "${zips[@]}"; do
            echo "::group::Processing ${zipfile}"
            unzip -t "$zipfile"

            temp_dir="$(mktemp -d)"
            unzip -q "$zipfile" -d "$temp_dir"

            # Flatten a single enclosing folder, such as jojo-gba-package/.
            mapfile -t top_entries < <(find "$temp_dir" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
            source_dir="$temp_dir"
            if [ "${#top_entries[@]}" -eq 1 ] && [ -d "$temp_dir/${top_entries[0]}" ]; then
              source_dir="$temp_dir/${top_entries[0]}"
              echo "Detected enclosing folder: ${top_entries[0]}; flattening its contents."
            else
              echo "Archive already has root-relative contents."
            fi

            echo "Files to merge:"
            find "$source_dir" -maxdepth 3 -type f -print | sort

            # Merge project files. Keep the installed unpack.yml and ci.yml.
            rsync -a \
              --exclude='.git/' \
              --exclude='.github/workflows/unpack.yml' \
              --exclude='.github/workflows/ci.yml' \
              "$source_dir/" ./

            rm -rf "$temp_dir"
            git rm -q -f -- "$zipfile"
            echo "::endgroup::"
          done

      - name: Apply REMOVE.txt instructions
        shell: bash
        run: |
          set -euo pipefail
          if [ -f REMOVE.txt ]; then
            while IFS= read -r path || [ -n "$path" ]; do
              case "$path" in
                ''|'#'*|.git*|*..*|/*) continue ;;
              esac
              git rm -r -q --ignore-unmatch -- "$path"
            done < REMOVE.txt
            rm -f REMOVE.txt
          fi

      - name: Commit extracted project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "Unpack update ZIP"
          git push
