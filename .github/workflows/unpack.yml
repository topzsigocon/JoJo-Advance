name: Unpack ZIP and Build JoJo GBA ROM

on:
  push:
    branches: [main]
    paths:
      - 'update.zip'
      - 'updates/*.zip'
      - '.github/workflows/unpack.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jojo-gba-unpack-build
  cancel-in-progress: true

jobs:
  unpack-and-build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/opt/devkitpro/portlibs/gba/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and validate the single update ZIP
        id: update
        shell: bash
        run: |
          set -euo pipefail
          command -v arm-none-eabi-g++
          command -v make
          command -v python3
          command -v git
          command -v unzip

          if [[ -f update.zip ]]; then
            zip_path='update.zip'
          elif [[ -f updates/update.zip ]]; then
            zip_path='updates/update.zip'
          else
            echo 'ERROR: No update ZIP found.'
            echo 'Upload your project archive as update.zip in the repository root.'
            echo 'Alternatively, use updates/update.zip.'
            exit 1
          fi

          echo "Using project archive: ${zip_path}"
          echo "zip_path=${zip_path}" >> "$GITHUB_OUTPUT"
          unzip -t "$zip_path"

      - name: Extract project files into repository root
        shell: bash
        env:
          ZIP_PATH: ${{ steps.update.outputs.zip_path }}
        run: |
          set -euo pipefail
          # ZIP entries must be root-relative, e.g. src/main.cpp and Makefile.
          unzip -o "$ZIP_PATH" -d . \
            -x '.github/workflows/unpack.yml' \
               '.github/workflows/build-gba.yml'

      - name: Check required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f Makefile
          test -f src/main.cpp
          test -f scripts/validate_roster.py
          test -f scripts/verify_gba_rom.py

      - name: Validate roster plan
        shell: bash
        run: python3 scripts/validate_roster.py

      - name: Fetch Butano 21.9.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 21.9.0 https://github.com/GValiente/butano.git ../butano

      - name: Build GBA ROM
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make -j2
          test -s jojo_allstar_gba.gba

      - name: Verify ROM header
        shell: bash
        run: python3 scripts/verify_gba_rom.py jojo_allstar_gba.gba

      - name: Upload GBA ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: jojo-allstar-gba
          path: jojo_allstar_gba.gba
          if-no-files-found: error
          retention-days: 30
