name: Unpack Update ZIP and Build JoJo GBA

on:
  push:
    branches: [main]
    paths:
      - 'updates/*.zip'
      - '.github/workflows/unpack.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jojo-gba-unpack-build
  cancel-in-progress: true

jobs:
  unpack-and-build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/opt/devkitpro/portlibs/gba/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check toolchain and update ZIP
        shell: bash
        run: |
          set -euo pipefail
          command -v arm-none-eabi-g++
          command -v make
          command -v python3
          command -v git
          command -v unzip
          test -f updates/update.zip || {
            echo 'ERROR: updates/update.zip was not found.'
            echo 'Upload your project ZIP to updates/update.zip.'
            exit 1
          }
          unzip -t updates/update.zip

      - name: Extract root-relative project files
        shell: bash
        run: |
          set -euo pipefail
          # The ZIP must contain paths relative to the repository root:
          # src/main.cpp, Makefile, roster/..., etc.
          # Keep this workflow as the single build entry point.
          unzip -o updates/update.zip -d . \
            -x '.github/workflows/unpack.yml' \
               '.github/workflows/build-gba.yml'

      - name: Confirm required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f Makefile
          test -f src/main.cpp
          test -f scripts/validate_roster.py
          test -f scripts/verify_gba_rom.py

      - name: Validate roster plan
        shell: bash
        run: python3 scripts/validate_roster.py

      - name: Fetch Butano 21.9.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 21.9.0 https://github.com/GValiente/butano.git ../butano

      - name: Build GBA ROM
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make -j2
          test -s jojo_allstar_gba.gba

      - name: Verify ROM header
        shell: bash
        run: python3 scripts/verify_gba_rom.py jojo_allstar_gba.gba

      - name: Upload playable ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: jojo-allstar-gba
          path: jojo_allstar_gba.gba
          if-no-files-found: error
          retention-days: 30
